[package]
name = "sage-einsums"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Independent Rust implementation for SAGE Einsums translation campaigns"

[lib]
name = "sage_einsums"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "einsums-candidate"
path = "src/main.rs"

[dependencies]
nalgebra = { version = "=0.33.2", default-features = false, features = ["std"] }
num-complex = { version = "=0.4.6", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
hdf5 = "=0.8.1"
hdf5-sys = { version = "=0.8.1", features = ["static", "zlib"] }
