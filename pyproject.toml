[project]
name = "sage-equivalence"
version = "0.1.0"
description = "SAGE: Semantically Aligned Generation and Equivalence"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=2.0",
  "PyYAML>=6.0",
  "typer>=0.15",
]

[project.optional-dependencies]
openai = ["openai>=1.0"]
dev = ["mypy>=1.13", "pytest>=8.0", "ruff>=0.9", "types-PyYAML>=6.0", "h5py>=3.11,<4", "scipy==1.16.1"]

[project.scripts]
sage = "sage.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".sage", "runs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["sage"]

[tool.hatch.build.targets.wheel]
packages = ["sage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
